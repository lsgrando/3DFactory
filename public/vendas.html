<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Vendas — Impressão 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Vendas</h1>
  <p class="subtitle">Registre o pedido do cliente e acompanhe orçamento, aprovação, produção, entrega e pagamento.</p>

  <div class="toolbar">
    <div class="field search"><input id="busca-pedido" placeholder="Buscar por #pedido, cliente ou Id da plataforma..." /></div>
    <button type="button" onclick="abrirNovoPedido()">+ Novo pedido</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>#</th><th>Cliente</th><th>Produtos</th><th>Status</th><th>Valor</th><th>Entrega</th><th>Pagamento</th><th>Ações</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <h2>Fila de produção</h2>
  <div class="card" id="fila"></div>

  <h2>Imprimindo agora</h2>
  <div class="card" id="imprimindo"></div>
</main>

<div id="modal-bg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
  <div class="modal-wrap" style="width:600px;max-width:92vw;">
    <button type="button" class="modal-close" onclick="closeModal()" aria-label="Fechar">&times;</button>
    <div class="card" style="max-height:90vh;overflow:auto;" id="modal-content"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
renderNav('vendas.html');

let filamentosCache = [];
let produtosCache = [];
let clientesCache = [];
let impressorasCache = [];
let variacoesCache = [];
let usuariosCache = [];
let pedidosCache = [];
let paramsCache = {};
let contasCache = [];
let sociosCache = [];
let itemSeq = 0;
let pedidoEmEdicaoId = null;
let pedidoEmEdicaoStatus = null;

const CUSTO_FILAMENTO_PADRAO = 120; // R$/kg usado quando a variação não tem filamento sugerido
const POTENCIA_PADRAO = 200; // W usado quando a variação não tem impressora sugerida

function estimarFaixaPreco(v) {
  const filamento = v.filamentoIdSugerido ? filamentosCache.find((f) => f.id === v.filamentoIdSugerido) : null;
  const impressora = v.impressoraIdSugerida ? impressorasCache.find((i) => i.id === v.impressoraIdSugerida) : null;
  const precoPorKg = filamento ? filamento.precoPorKg : CUSTO_FILAMENTO_PADRAO;
  const potenciaW = impressora ? impressora.potenciaW : POTENCIA_PADRAO;
  const tarifaKwh = paramsCache.tarifaKwh || 0;
  const custoFilamento = (precoPorKg / 1000) * (v.pesoGramas || 0);
  const custoEnergia = ((potenciaW * (v.tempoHoras || 0)) / 1000) * tarifaKwh;
  const custoTotal = custoFilamento + custoEnergia;
  return { min: custoTotal * 2, max: custoTotal * 4 }; // margem de 100% a 300%
}

function corFilamentoItens() {
  return filamentosCache.map(f => ({ value: `${f.material} ${f.cor}`, label: `${f.material} — ${f.cor}${f.marca ? ' (' + f.marca + ')' : ''}`, hex: f.corHex }));
}
function filamentoItens() {
  return filamentosCache.map(f => ({ value: f.id, label: `${f.material}${f.marca ? ' ' + f.marca : ''} — ${f.cor} (R$${f.precoPorKg}/kg)`, hex: f.corHex }));
}
function impressoraItens() {
  return impressorasCache.map(i => ({ value: i.id, label: `${i.nome} (${i.potenciaW}W)` }));
}
// Impressora padrão pra um item novo (ainda sem orçamento salvo) — a maioria do parque é A1,
// então já vem uma pré-selecionada em vez de forçar escolher toda vez; o vendedor troca se for
// usar outro modelo.
function impressoraPadraoA1() {
  const a1 = impressorasCache.find(i => /a1/i.test(i.nome));
  return a1 ? a1.id : '';
}
function clienteItens() {
  return clientesCache.map(c => ({ value: c.id, label: c.nome }));
}
function corSugeridaDoProduto(produtoId) {
  const variacao = variacoesCache.find(v => v.produtoId === produtoId && v.filamentoIdSugerido);
  if (!variacao) return '';
  const f = filamentosCache.find(f => f.id === variacao.filamentoIdSugerido);
  return f ? `${f.material} ${f.cor}` : '';
}
function usuarioOptions() {
  const atual = window.currentUser ? window.currentUser.nome : '';
  return '<option value="">— Selecionar —</option>' +
    usuariosCache.map(u => `<option value="${escapeAttr(u.nome)}" ${u.nome === atual ? 'selected' : ''}>${escapeHtml(u.nome)}</option>`).join('');
}

function mostrarInfoProduto(div, produtoId) {
  const produto = produtoId ? produtosCache.find(p => p.id === produtoId) : null;
  const thumbField = div.querySelector('.produto-thumb-field');
  const thumb = div.querySelector('.produto-thumb');
  const variacaoSelectField = div.querySelector('.variacao-select-field');
  const variacaoWrap = div.querySelector('.variacao-select-wrap');
  if (produto && produto.imagem) { thumb.src = produto.imagem; thumbField.style.display = ''; }
  else { thumbField.style.display = 'none'; }
  const variacoesDoProduto = produto ? variacoesCache.filter(v => v.produtoId === produto.id) : [];
  if (variacoesDoProduto.length) {
    variacaoWrap.innerHTML = `<input class="search-select-input" placeholder="Buscar variação..." autocomplete="off" /><div class="search-select-list"></div>`;
    wireSearchSelect(variacaoWrap, variacoesDoProduto.map(v => ({ value: v.id, label: v.nome })), (val) => {
      if (val) aplicarVariacaoNoItem(div, val);
    }, '', '— Selecionar —');
    variacaoSelectField.style.display = '';
  } else {
    variacaoSelectField.style.display = 'none';
  }
}

// Único ponto que aplica uma variação cadastrada: preenche o texto da variação e,
// se o item já tiver a seção de orçamento montada (div._filRows/_impCtrl), também
// pré-preenche peso/tempo/filamento/impressora — evita perguntar a mesma coisa 2x.
// A variação do catálogo é single-filamento — preenche só a primeira linha; o vendedor
// adiciona linhas extras manualmente se a peça real usa mais de um filamento.
function aplicarVariacaoNoItem(div, variacaoId) {
  const v = variacoesCache.find(x => x.id === Number(variacaoId));
  if (!v) return;
  div.querySelector('[name="variacao"]').value = v.nome;
  if (v.tempoHoras) { const el = div.querySelector('.orc-tempo'); if (el) el.value = v.tempoHoras; }
  if (div._filRows && div._filRows[0]) {
    if (v.pesoGramas) div._filRows[0].pesoInput.value = v.pesoGramas;
    if (v.filamentoIdSugerido) div._filRows[0].ctrl.setValue(v.filamentoIdSugerido);
  }
  if (v.impressoraIdSugerida && div._impCtrl) div._impCtrl.setValue(v.impressoraIdSugerida);
  if (div._recalcularFaixa) div._recalcularFaixa();
}

function aplicarProdutoSelecionado(div, produtoId) {
  const produto = produtoId ? produtosCache.find(p => p.id === produtoId) : null;
  const novoProdutoField = div.querySelector('.chk-novo-produto-field');
  const novoProdutoFields = div.querySelector('.novo-produto-fields');
  if (produto) {
    div.querySelector('[name="descricao"]').value = produto.descricao || produto.nome;
    div.querySelector('[name="dimensoes"]').value = produto.dimensoes || '';
    if (div._corCtrl) div._corCtrl.setValue(corSugeridaDoProduto(produto.id));
    div.querySelector('[name="modeloRef"]').value = produto.modeloRef || '';
    div.querySelector('[name="pecaJaFeita"]').value = 'true';
    novoProdutoField.style.display = 'none';
    novoProdutoFields.style.display = 'none';
    div.querySelector('.chk-novo-produto').checked = false;
  } else {
    novoProdutoField.style.display = '';
  }
  mostrarInfoProduto(div, produtoId);
}

function orcamentoFieldsHtml(item) {
  const o = item.orcamento;
  return `
    <div class="field" style="min-width:100%"><label>Filamentos usados</label>
      <div class="orc-filamentos-linhas"></div>
      <button type="button" class="small secondary btn-add-filamento" style="margin-top:4px">+ Adicionar filamento</button>
    </div>
    <div class="field"><label>Impressora sugerida</label>
      <div class="search-select orc-impressoraId">
        <input class="search-select-input" placeholder="Buscar impressora..." autocomplete="off" />
        <div class="search-select-list"></div>
      </div>
    </div>
    <div class="field"><label>Tempo de impressão (h)</label><input class="orc-tempo" type="number" step="0.01" value="${o ? o.tempoHoras : ''}" /></div>
    <div class="field"><label>Tarifa kWh (R$)</label><input class="orc-tarifa" type="number" step="0.01" placeholder="${paramsCache.tarifaKwh || ''}" value="${o ? o.tarifaKwh : ''}" /></div>
    <div class="field"><label>Margem (%)</label><input class="orc-margem" type="number" step="1" placeholder="${paramsCache.margemPadrao || ''}" value="${o && o.margemPercentual != null ? o.margemPercentual : ''}" /></div>
    <div class="field"><label>Preço final (R$)</label><input class="orc-valor" type="number" step="0.01" placeholder="usa a margem acima se vazio" value="${o ? o.precoVenda : ''}" /></div>
    <div class="field"><label>Validade do orçamento</label><input class="orc-validade" type="date" value="${o && o.validadeOrcamento ? o.validadeOrcamento.slice(0, 10) : ''}" /></div>
    <div class="orc-faixa-estimada muted" style="min-width:100%;font-size:13px"></div>
    ${o ? `<div class="price-box" style="min-width:100%;margin-top:0"><div>Orçado: <b>${money(o.precoVenda)}</b> <span class="muted">(${somaPesoOrcamento(o)}g, ${o.tempoHoras}h)</span>${o.validadeOrcamento ? ` · válido até ${escapeAttr(o.validadeOrcamento.slice(0, 10))}` : ''}</div></div>` : ''}
  `;
}

// Adiciona uma linha de filamento (seletor + peso) na seção de orçamento de um item — uma peça
// pode usar mais de um filamento (multicor/multimaterial), então o orçamento guarda uma lista.
function addLinhaFilamento(div, section, dados) {
  dados = dados || {};
  const row = document.createElement('div');
  row.className = 'orc-filamento-linha';
  row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap';
  row.innerHTML = `
    <div class="search-select orc-filamento-item" style="flex:1;min-width:180px">
      <input class="search-select-input" placeholder="Buscar filamento..." autocomplete="off" />
      <div class="search-select-list"></div>
    </div>
    <input class="orc-peso-item" type="number" step="0.01" placeholder="Peso (g)" value="${dados.pesoGramas != null ? dados.pesoGramas : ''}" style="width:110px" />
    <button type="button" class="small danger btn-remover-filamento-linha">✕</button>
  `;
  section.querySelector('.orc-filamentos-linhas').appendChild(row);
  const ctrl = wireSearchSelect(row.querySelector('.orc-filamento-item'), filamentoItens(), () => recalcularFaixaEstimada(div), dados.filamentoId || '', 'Selecione um filamento');
  row.querySelector('.orc-peso-item').addEventListener('input', () => recalcularFaixaEstimada(div));
  row.querySelector('.btn-remover-filamento-linha').addEventListener('click', () => {
    row.remove();
    div._filRows = div._filRows.filter((r) => r.row !== row);
    recalcularFaixaEstimada(div);
  });
  div._filRows.push({ row, ctrl, pesoInput: row.querySelector('.orc-peso-item') });
}

// Custo total (filamento + energia) com os valores atuais dos campos do item — mesma
// fórmula do servidor (lib/pricing.js). Retorna null se faltar algo pra calcular.
function custoTotalAtual(div) {
  const section = div.querySelector('.orcamento-item-section');
  const tempo = Number(section.querySelector('.orc-tempo').value) || 0;
  if (!tempo || !div._filRows || !div._filRows.length) return null;
  let custoFilamento = 0;
  let algumValido = false;
  div._filRows.forEach(({ ctrl, pesoInput }) => {
    const filamento = filamentosCache.find(f => f.id === Number(ctrl.getValue()));
    const peso = Number(pesoInput.value) || 0;
    if (filamento && peso > 0) {
      custoFilamento += (filamento.precoPorKg / 1000) * peso;
      algumValido = true;
    }
  });
  if (!algumValido) return null;
  const impressora = impressorasCache.find(i => i.id === Number(div._impCtrl.getValue()));
  const tarifaInput = section.querySelector('.orc-tarifa').value;
  const tarifaKwh = tarifaInput !== '' ? Number(tarifaInput) : (paramsCache.tarifaKwh || 0);
  const potenciaW = impressora ? impressora.potenciaW : POTENCIA_PADRAO;
  const custoEnergia = ((potenciaW * tempo) / 1000) * tarifaKwh;
  return custoFilamento + custoEnergia;
}

// Calcula ao vivo (sem salvar) a faixa de preço sugerida — mesma faixa de margem
// 100%-300% já usada em orcamento.html. Clicar numa linha preenche Margem e Preço final;
// editar a Margem manualmente volta a deixar o Preço final livre (recalculado ao salvar).
function recalcularFaixaEstimada(div) {
  if (!div._filRows || !div._impCtrl) return;
  const section = div.querySelector('.orcamento-item-section');
  const faixaEl = section.querySelector('.orc-faixa-estimada');
  const custoTotal = custoTotalAtual(div);
  if (custoTotal === null) { faixaEl.innerHTML = ''; return; }
  const margemInput = section.querySelector('.orc-margem').value;
  const margemAtual = margemInput !== '' ? Number(margemInput) : null;
  const linhas = [100, 150, 200, 300].map((m) => {
    const preco = custoTotal * (1 + m / 100);
    const ativo = margemAtual === m;
    return `<div class="orc-faixa-linha${ativo ? ' ativo' : ''}" data-margem="${m}" data-preco="${preco.toFixed(2)}">
      <span>${m}%</span><span>${money(preco)}</span>
    </div>`;
  }).join('');
  faixaEl.innerHTML = `<div class="orc-faixa-custo">Custo estimado: <b>${money(custoTotal)}</b></div>${linhas}`;
  faixaEl.querySelectorAll('.orc-faixa-linha').forEach((el) => {
    el.addEventListener('click', () => {
      section.querySelector('.orc-margem').value = el.dataset.margem;
      section.querySelector('.orc-valor').value = el.dataset.preco;
      recalcularFaixaEstimada(div);
    });
  });
  atualizarTotalPedido();
}

// Soma o preço já orçado (ou o preview ao vivo, se o item ainda não foi salvo) de todos os
// itens do modal aberto no momento — recalculado a cada mudança relevante em qualquer item.
function atualizarTotalPedido() {
  const el = document.getElementById('total-pedido');
  if (!el) return;
  let total = 0;
  let temNaoOrcado = false;
  document.querySelectorAll('#itens-container .item-block').forEach((div) => {
    const quantidadeInput = div.querySelector('[name="quantidade"]');
    const quantidade = quantidadeInput ? Number(quantidadeInput.value) || 1 : 1;
    const preview = previewOrcamentoAtual(div);
    if (preview) total += preview.precoVenda * quantidade;
    else temNaoOrcado = true;
  });
  if (pedidoEmEdicaoId) {
    const pedidoAtual = pedidosCache.find((x) => x.id === pedidoEmEdicaoId);
    if (pedidoAtual) total += totalDespesasPedido(pedidoAtual);
  }
  el.innerHTML = `Total do pedido: <b>${money(total)}</b>` + (temNaoOrcado ? ' <span class="muted">(considera só os produtos já orçados)</span>' : '');
}

// Lê os campos de orçamento preenchidos no momento (filamento, peso, tempo, margem/preço).
// Retorna null se faltar filamento/peso/tempo — usado tanto pelo salvamento imediato (item já
// existente) quanto por collectItem() pra mandar o orçamento junto na criação do pedido/item.
function coletarOrcamentoInput(div) {
  if (!div._filRows || !div._impCtrl) return null;
  const section = div.querySelector('.orcamento-item-section');
  const tempoHoras = section.querySelector('.orc-tempo').value;
  const filamentos = div._filRows
    .map(({ ctrl, pesoInput }) => ({ filamentoId: ctrl.getValue(), pesoGramas: pesoInput.value }))
    .filter((f) => f.filamentoId && f.pesoGramas);
  if (!filamentos.length || !tempoHoras) return null;
  const body = {
    filamentos,
    impressoraId: div._impCtrl.getValue(),
    tempoHoras,
    tarifaKwh: section.querySelector('.orc-tarifa').value,
    validadeOrcamento: section.querySelector('.orc-validade').value
  };
  const valorFinal = section.querySelector('.orc-valor').value;
  if (valorFinal !== '') {
    const custoTotal = custoTotalAtual(div) || 0;
    body.margemFixa = String(Number(valorFinal) - custoTotal);
  } else {
    body.margemPercentual = section.querySelector('.orc-margem').value;
  }
  return body;
}

// Preview do preço orçado sem salvar nada (item ainda não existe no banco) — só pra o resumo
// do item mostrar "Orçado: R$X" em vez de "Não orçado" assim que o vendedor preenche os campos
// e clica em Concluir. O cálculo definitivo (e o que efetivamente é salvo) é sempre o do servidor.
function previewOrcamentoAtual(div) {
  const input = coletarOrcamentoInput(div);
  if (!input) return null;
  const custoTotal = custoTotalAtual(div) || 0;
  const precoVenda = input.margemFixa !== undefined
    ? custoTotal + Number(input.margemFixa)
    : custoTotal * (1 + Number(input.margemPercentual || paramsCache.margemPadrao || 0) / 100);
  const filamentos = input.filamentos.map((f) => ({ filamentoId: Number(f.filamentoId), pesoGramas: Number(f.pesoGramas) }));
  return { precoVenda, filamentos, tempoHoras: Number(input.tempoHoras) };
}

function wireOrcamentoFields(div, item) {
  const section = div.querySelector('.orcamento-item-section');
  const o = item.orcamento;
  section.innerHTML = orcamentoFieldsHtml(item);
  div._filRows = [];
  const filamentosExistentes = filamentosDoOrcamento(o);
  if (filamentosExistentes.length) {
    filamentosExistentes.forEach((f) => addLinhaFilamento(div, section, f));
  } else {
    addLinhaFilamento(div, section, {});
  }
  section.querySelector('.btn-add-filamento').addEventListener('click', () => addLinhaFilamento(div, section, {}));
  div._impCtrl = wireSearchSelect(section.querySelector('.orc-impressoraId'), impressoraItens(), () => recalcularFaixaEstimada(div), o ? o.impressoraSugeridaId : impressoraPadraoA1(), 'Selecione uma impressora');
  div._recalcularFaixa = () => recalcularFaixaEstimada(div);
  ['orc-tempo', 'orc-tarifa', 'orc-margem'].forEach((cls) => {
    section.querySelector(`.${cls}`).addEventListener('input', () => recalcularFaixaEstimada(div));
  });
  // Editar a margem manualmente (não via clique na faixa) volta o Preço final pro modo
  // automático — evita salvar um preço "preso" de uma seleção anterior.
  section.querySelector('.orc-margem').addEventListener('input', () => {
    section.querySelector('.orc-valor').value = '';
  });
  recalcularFaixaEstimada(div);
  // Item já existe no banco (pedido salvo antes) — "Concluir" salva o orçamento na hora via PATCH.
  // Item novo (ainda sem id, sendo criado ou adicionado a um pedido existente) não tem essa função:
  // os dados ficam só nos campos e collectItem() os envia junto no POST do pedido/item.
  if (item.id) {
    div._salvarOrcamentoSeCompleto = async () => {
      const body = coletarOrcamentoInput(div);
      if (!body) return false;
      await apiPatch(`/api/pedidos/${pedidoEmEdicaoId}/itens/${item.id}/orcamento`, body);
      return true;
    };
  }
}

function renderResumoItem(div, valores) {
  const summary = div.querySelector('.item-summary');
  const descricao = div.querySelector('[name="descricao"]').value || '(sem descrição)';
  const quantidade = div.querySelector('[name="quantidade"]').value || 1;
  const cor = div.querySelector('[name="corFilamento"]').value;
  const variacao = div.querySelector('[name="variacao"]').value;
  const produtoId = div.dataset.produtoId;
  const produto = produtoId ? produtosCache.find(p => p.id === Number(produtoId)) : null;
  const thumbHtml = produto && produto.imagem
    ? `<img class="thumb item-summary-thumb" src="${escapeAttr(produto.imagem)}" />`
    : `<span class="thumb item-summary-thumb" style="display:inline-block"></span>`;
  const subTxt = [cor, variacao].filter(Boolean).map(escapeAttr).join(' · ') || '—';
  const o = valores.orcamento;
  const precoHtml = o
    ? `<span class="item-summary-price">${money(o.precoVenda * Number(quantidade))}</span>`
    : `<span class="item-summary-price muted">Não orçado</span>`;
  summary.innerHTML = `
    ${thumbHtml}
    <div class="item-summary-info">
      <div class="item-summary-title">${escapeAttr(quantidade)}x ${escapeAttr(descricao)}</div>
      <div class="item-summary-sub">${subTxt}</div>
    </div>
    ${precoHtml}
    <div class="item-summary-actions">
      <button type="button" class="small secondary btn-editar-item">✎ Editar</button>
      <button type="button" class="small danger btn-remover-item-resumo">✕</button>
    </div>
  `;
  summary.querySelector('.btn-editar-item').addEventListener('click', () => alternarModoItem(div, true));
  summary.querySelector('.btn-remover-item-resumo').addEventListener('click', () => removerItem(div));
}

function alternarModoItem(div, expandir) {
  const summary = div.querySelector('.item-summary');
  const details = div.querySelector('.item-details');
  if (expandir) {
    summary.style.display = 'none';
    details.style.display = 'flex';
  } else {
    details.style.display = 'none';
    summary.style.display = 'flex';
  }
}

async function removerItem(div) {
  const itemId = div.dataset.itemId;
  if (itemId && pedidoEmEdicaoId) {
    if (!['novo', 'orcamento_pronto'].includes(pedidoEmEdicaoStatus)) {
      toast('Só é possível remover produtos antes da aprovação do pedido.', 'error');
      return;
    }
    if (document.querySelectorAll('.item-block').length <= 1) {
      toast('O pedido precisa ter ao menos um produto.', 'error');
      return;
    }
    if (!confirm('Remover este produto do pedido?')) return;
    await apiDelete(`/api/pedidos/${pedidoEmEdicaoId}/itens/${itemId}`);
    toast('Produto removido do pedido.');
    div.remove();
    pedidosCache = await apiGet('/api/pedidos');
    renderPedidos();
    const atualizado = pedidosCache.find((x) => x.id === pedidoEmEdicaoId);
    if (atualizado) pedidoEmEdicaoStatus = atualizado.status;
  } else {
    if (document.querySelectorAll('.item-block').length <= 1) return;
    div.remove();
  }
  atualizarTotalPedido();
}

function addItemBlock(valores) {
  valores = valores || {};
  const uid = ++itemSeq;
  const div = document.createElement('div');
  div.className = 'item-block';
  div.dataset.uid = uid;
  if (valores.id) div.dataset.itemId = valores.id;
  if (valores.produtoId) div.dataset.produtoId = valores.produtoId;
  div.innerHTML = `
    <div class="item-summary" style="display:none"></div>
    <div class="item-details">
      <div class="field" style="min-width:220px"><label>Produto cadastrado</label>
        <div class="produto-combobox">
          <input type="text" class="produto-combobox-input" placeholder="Buscar produto..." autocomplete="off" />
          <div class="produto-combobox-list"></div>
        </div>
      </div>
      <div class="field produto-thumb-field" style="display:${valores.imagem ? '' : 'none'}"><label>&nbsp;</label><img class="thumb-lg produto-thumb" src="${escapeAttr(valores.imagem || '')}" /></div>
      <div class="field" style="min-width:100%"><label>Descrição da peça</label><textarea name="descricao" required placeholder="O que o cliente pediu">${escapeAttr(valores.descricao || '')}</textarea></div>
      <div class="field"><label>Já imprimimos essa peça antes?</label>
        <select name="pecaJaFeita"><option value="false" ${!valores.pecaJaFeita ? 'selected' : ''}>Não</option><option value="true" ${valores.pecaJaFeita ? 'selected' : ''}>Sim</option></select>
      </div>
      <div class="field" style="min-width:260px"><label>Link do modelo (Makerworld etc.) ou referência</label><input name="modeloRef" placeholder="https://..." value="${escapeAttr(valores.modeloRef || '')}" /></div>
      <div class="field"><label>Dimensões desejadas (mm)</label><input name="dimensoes" placeholder="ex: 100x50x30" value="${escapeAttr(valores.dimensoes || '')}" /></div>
      <div class="field variacao-select-field" style="display:none"><label>Variação cadastrada</label><div class="search-select variacao-select-wrap"></div></div>
      <div class="field"><label>Variação</label><input name="variacao" placeholder="ex: P, M, G, altura +2cm" value="${escapeAttr(valores.variacao || '')}" /></div>
      <div class="field"><label>Cor do filamento</label>
        <div class="search-select cor-filamento-wrap">
          <input type="hidden" name="corFilamento" />
          <input class="search-select-input" placeholder="Buscar cor..." autocomplete="off" />
          <div class="search-select-list"></div>
        </div>
      </div>
      <div class="field"><label>Quantidade</label><input name="quantidade" type="number" min="1" value="${escapeAttr(valores.quantidade || 1)}" /></div>
      <div class="field chk-novo-produto-field"><label><input type="checkbox" class="chk-novo-produto" /> Cadastrar este produto no catálogo</label></div>
      <div class="novo-produto-fields" style="display:none;min-width:100%;flex-wrap:wrap;gap:10px;">
        <div class="field"><label>Nome do produto (catálogo)</label><input class="input-nome-produto" /></div>
        <div class="field" style="min-width:220px">
          <label>Imagem</label>
          <div class="dropzone item-dropzone-imagem">
            <img class="thumb-lg preview-imagem-item" style="display:none" alt="Prévia da imagem" />
            <p class="muted dropzone-texto-item" style="margin:0;font-size:12px">Arraste, cole (Ctrl+V) ou <span class="dropzone-link">clique</span> pra escolher uma imagem</p>
            <input type="file" class="input-imagem-produto" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" />
          </div>
        </div>
      </div>
      <div class="orcamento-item-section item-details-footer" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end"></div>
      <div class="row item-details-footer" style="width:100%">
        <button type="button" class="small secondary btn-concluir-item">Concluir</button>
        <button type="button" class="small danger btn-remover-item-detalhe">✕ Remover produto</button>
      </div>
    </div>
  `;
  // Monta a seção de orçamento ANTES do seletor de cor, pra que o auto-link cor→filamento
  // (mais abaixo) já encontre div._filRows pronto mesmo no carregamento inicial do item. Roda
  // pra todo item (novo ou já existente) — permite orçar já na criação do pedido.
  wireOrcamentoFields(div, valores);
  div._corCtrl = wireSearchSelect(div.querySelector('.cor-filamento-wrap'), corFilamentoItens(), (val) => {
    div.querySelector('[name="corFilamento"]').value = val;
    if (val && div._filRows && div._filRows[0] && !div._filRows[0].ctrl.getValue()) {
      const match = filamentosCache.find(f => `${f.material} ${f.cor}` === val);
      if (match) div._filRows[0].ctrl.setValue(match.id);
    }
  }, valores.corFilamento || '', 'Digitar manualmente');
  wireImageDropzone(
    div.querySelector('.item-dropzone-imagem'),
    div.querySelector('.input-imagem-produto'),
    async (file) => {
      const preview = div.querySelector('.preview-imagem-item');
      preview.src = await fileToBase64(file);
      preview.style.display = 'inline-block';
      div.querySelector('.dropzone-texto-item').style.display = 'none';
    }
  );

  div.querySelector('.btn-remover-item-detalhe').addEventListener('click', () => removerItem(div));
  div.querySelector('.btn-concluir-item').addEventListener('click', async () => {
    if (!div.querySelector('[name="descricao"]').value.trim()) {
      toast('Preencha a descrição da peça antes de concluir.', 'error');
      return;
    }
    const itemId = div.dataset.itemId;
    if (itemId && pedidoEmEdicaoId) {
      // O PATCH de orçamento abaixo só grava peso/tempo/preço — sem isto, mudanças em
      // quantidade/descrição/etc feitas junto no mesmo item ficariam de fora do "Concluir".
      await apiPatch(`/api/pedidos/${pedidoEmEdicaoId}/itens/${itemId}`, {
        descricao: div.querySelector('[name="descricao"]').value,
        quantidade: div.querySelector('[name="quantidade"]').value,
        dimensoes: div.querySelector('[name="dimensoes"]').value,
        variacao: div.querySelector('[name="variacao"]').value,
        corFilamento: div.querySelector('[name="corFilamento"]').value,
        produtoId: div.dataset.produtoId || null
      });
    }
    if (div._salvarOrcamentoSeCompleto) {
      const salvou = await div._salvarOrcamentoSeCompleto();
      if (salvou) {
        toast('Orçamento salvo com sucesso!');
        pedidosCache = await apiGet('/api/pedidos');
        renderPedidos();
        renderFila();
        abrirEditarPedido(pedidoEmEdicaoId);
        return;
      }
    } else {
      valores.orcamento = previewOrcamentoAtual(div) || valores.orcamento;
    }
    renderResumoItem(div, valores);
    alternarModoItem(div, false);
    atualizarTotalPedido();
  });
  // Produto desativado some da lista pra não ser escolhido em pedidos novos, mas continua
  // aparecendo aqui se já era o produto deste item (senão o combobox mostraria em branco).
  const produtosSelecionaveis = produtosCache.filter((p) => p.ativo !== false || p.id === valores.produtoId);
  wireProdutoCombobox(div.querySelector('.produto-combobox'), produtosSelecionaveis, (produtoId) => {
    div.dataset.produtoId = produtoId || '';
    aplicarProdutoSelecionado(div, produtoId);
  }, valores.produtoId || null);
  if (valores.produtoId) mostrarInfoProduto(div, valores.produtoId);
  div.querySelector('.chk-novo-produto').addEventListener('change', (e) => {
    div.querySelector('.novo-produto-fields').style.display = e.target.checked ? 'flex' : 'none';
  });

  if (valores.id) {
    renderResumoItem(div, valores);
    alternarModoItem(div, false);
  }
  div.querySelector('[name="quantidade"]').addEventListener('input', atualizarTotalPedido);

  document.getElementById('itens-container').appendChild(div);
  atualizarTotalPedido();
}

async function collectItem(block) {
  const produtoIdSelecionado = block.dataset.produtoId || '';
  const item = {
    descricao: block.querySelector('[name="descricao"]').value,
    pecaJaFeita: block.querySelector('[name="pecaJaFeita"]').value === 'true',
    modeloRef: block.querySelector('[name="modeloRef"]').value,
    dimensoes: block.querySelector('[name="dimensoes"]').value,
    variacao: block.querySelector('[name="variacao"]').value,
    corFilamento: block.querySelector('[name="corFilamento"]').value,
    quantidade: block.querySelector('[name="quantidade"]').value,
    produtoId: produtoIdSelecionado || null,
    imagem: null,
    orcamentoInput: coletarOrcamentoInput(block)
  };
  if (produtoIdSelecionado) {
    const produto = produtosCache.find(p => p.id === Number(produtoIdSelecionado));
    item.imagem = produto ? produto.imagem : null;
    return item;
  }
  const chkNovo = block.querySelector('.chk-novo-produto');
  if (chkNovo.checked) {
    const nome = block.querySelector('.input-nome-produto').value || item.descricao;
    const file = block.querySelector('.input-imagem-produto').files[0];
    const produtoBody = {
      nome,
      descricao: item.descricao,
      dimensoes: item.dimensoes,
      corFilamento: item.corFilamento,
      modeloRef: item.modeloRef
    };
    if (file) produtoBody.imagemBase64 = await fileToBase64(file);
    const produto = await apiPost('/api/produtos', produtoBody);
    toast(`Produto "${produto.nome}" cadastrado no catálogo!`);
    item.produtoId = produto.id;
    item.imagem = produto.imagem;
  }
  return item;
}

async function marcarEntrega(id, status) {

async function excluirPedido(id) {
  if (!confirm('Excluir este pedido definitivamente? Se já estiver pago, o pagamento é estornado no caixa. Se alguma peça já foi impressa, o filamento usado volta pro estoque. Essa ação não pode ser desfeita.')) return;
  await apiDelete(`/api/pedidos/${id}`);
  toast('Pedido excluído.');
  closeModal();
  load();
}
function abrirEditarPedido(id) {
  const p = pedidosCache.find((x) => x.id === id);
  if (!p) return;
  pedidoEmEdicaoId = p.id;
  pedidoEmEdicaoStatus = p.status;
  itemSeq = 0;
  const podeMexerItens = ['novo', 'orcamento_pronto'].includes(p.status);
  document.getElementById('modal-content').innerHTML = `

        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>

  p.itens.forEach((it) => addItemBlock(it));

    const form = e.target;

      cliente: form.cliente.value,
      contato: form.contato.value,
      vendedor: form.vendedor.value,

// ---------- Despesas adicionais do pedido (embalagem, frete etc.) ----------
// Somam ao valor cobrado do cliente e geram uma saída no Financeiro vinculada ao pedido, mas
// não aparecem detalhadas no orçamento impresso — só o total final (ver orcamento-imprimir.html).
const CATEGORIAS_DESPESA_PEDIDO = ['Material de embalagem', 'Frete para cliente', 'Outro'];

function renderDespesasPedido(p) {
  const container = document.getElementById('despesas-container');
  if (!container) return;
  const podeMexer = p.statusPagamento === 'pendente';
  const ativas = (p.despesasAdicionais || []).filter((d) => !d.estornado);
  container.innerHTML = `
    ${ativas.length ? ativas.map((d) => `
      <div class="row" style="align-items:center;margin-bottom:6px">
        <span>${escapeHtml(d.categoria === 'Outro' ? d.categoriaDetalhe : d.categoria)}${d.descricao ? ` — ${escapeHtml(d.descricao)}` : ''}</span>
        <b style="margin-left:auto">${money(d.valor)}</b>
        ${podeMexer ? `<button type="button" class="small danger btn-remover-despesa" data-id="${d.id}">✕</button>` : ''}
      </div>
    `).join('') : '<p class="muted" style="font-size:13px">Nenhuma despesa adicional lançada.</p>'}
    ${podeMexer
      ? '<div id="form-despesa-wrap"><button type="button" class="small secondary" id="btn-add-despesa">+ Adicionar despesa</button></div>'
      : '<p class="muted" style="font-size:13px">Pedido já tem pagamento registrado — estorne antes de alterar despesas.</p>'}
  `;
  container.querySelectorAll('.btn-remover-despesa').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remover esta despesa? O lançamento correspondente no caixa também é estornado.')) return;
      const atualizado = await apiDelete(`/api/pedidos/${p.id}/despesas/${btn.dataset.id}`);
      toast('Despesa removida.');
      atualizarPedidoEmEdicao(atualizado);
    });
  });
  const btnAdd = document.getElementById('btn-add-despesa');
  if (btnAdd) btnAdd.addEventListener('click', () => abrirFormDespesa(p));
}

function abrirFormDespesa(p) {
  const wrap = document.getElementById('form-despesa-wrap');
  const contaOpts = contasCache.map((c) => `<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join('');
  const categoriaOpts = CATEGORIAS_DESPESA_PEDIDO.map((c) => `<option value="${c}">${c}</option>`).join('');
  wrap.innerHTML = `
    <div class="inline" style="margin-top:8px">
      <div class="field"><label>Categoria</label><select name="categoria">${categoriaOpts}</select></div>
      <div class="field categoria-detalhe-field" style="display:none"><label>Descreva a categoria</label><input name="categoriaDetalhe" /></div>
      <div class="field"><label>Descrição (opcional)</label><input name="descricao" placeholder="ex: Sedex, caixa personalizada" /></div>
      <div class="field"><label>Valor (R$)</label><input name="valor" type="number" step="0.01" min="0.01" required /></div>
      <div class="field"><label>Conta que pagou</label><select name="contaId" id="despesa-conta">${contaOpts}</select></div>
      <div class="field"><label>Forma de pagamento</label><select name="formaPagamento" id="despesa-forma"></select></div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button type="button" class="small" id="btn-salvar-despesa">Salvar despesa</button>
      <button type="button" class="small secondary" id="btn-cancelar-despesa">Cancelar</button>
    </div>
  `;
  const categoriaSelect = wrap.querySelector('[name="categoria"]');
  const detalheField = wrap.querySelector('.categoria-detalhe-field');
  categoriaSelect.addEventListener('change', () => {
    detalheField.style.display = categoriaSelect.value === 'Outro' ? '' : 'none';
  });
  const despesaContaSelect = wrap.querySelector('#despesa-conta');
  const despesaFormaSelect = wrap.querySelector('#despesa-forma');
  const atualizarFormaDespesa = () => atualizarFormaPagamentoPorConta(despesaFormaSelect, contasCache.find((c) => c.id === Number(despesaContaSelect.value)));
  despesaContaSelect.addEventListener('change', atualizarFormaDespesa);
  atualizarFormaDespesa();
  wrap.querySelector('#btn-cancelar-despesa').addEventListener('click', () => renderDespesasPedido(p));
  wrap.querySelector('#btn-salvar-despesa').addEventListener('click', async () => {
    const valor = wrap.querySelector('[name="valor"]').value;
    if (!valor || Number(valor) <= 0) { toast('Informe um valor válido.', 'error'); return; }
    const atualizado = await apiPost(`/api/pedidos/${p.id}/despesas`, {
      categoria: categoriaSelect.value,
      categoriaDetalhe: wrap.querySelector('[name="categoriaDetalhe"]').value,
      descricao: wrap.querySelector('[name="descricao"]').value,
      valor,
      contaId: wrap.querySelector('[name="contaId"]').value,
      formaPagamento: wrap.querySelector('[name="formaPagamento"]').value
    });
    toast('Despesa adicionada!');
    atualizarPedidoEmEdicao(atualizado);
  });
}

// Atualiza o pedido em cache/tela depois de mudar suas despesas, sem fechar o modal.
function atualizarPedidoEmEdicao(pedidoAtualizado) {
  const idx = pedidosCache.findIndex((x) => x.id === pedidoAtualizado.id);
  if (idx >= 0) pedidosCache[idx] = pedidoAtualizado;
  else pedidosCache.push(pedidoAtualizado);
  renderPedidos();
  renderDespesasPedido(pedidoAtualizado);
  atualizarTotalPedido();
}

window.aprovar = aprovar; window.recusar = recusar; window.marcarEntrega = marcarEntrega; window.excluirPedido = excluirPedido; window.abrirEditarPedido = abrirEditarPedido;

// ---------- Produção ----------
async function atribuir(pedidoId, itemId, selectEl) {
  await apiPatch(`/api/pedidos/${pedidoId}/itens/${itemId}/producao`, { action: 'atribuir_impressora', impressoraId: selectEl.value });
  toast('Impressora atribuída!');
  load();
}
async function iniciar(pedidoId, itemId) {
  await apiPatch(`/api/pedidos/${pedidoId}/itens/${itemId}/producao`, { action: 'iniciar' });
  toast('Impressão iniciada!');
  load();
}
async function concluirImpressao(pedidoId, itemId) {
  if (!confirm('Concluir impressão? Isso vai dar baixa no estoque de filamento.')) return;
  await apiPatch(`/api/pedidos/${pedidoId}/itens/${itemId}/producao`, { action: 'concluir' });
  toast('Impressão concluída! Estoque atualizado.');
  load();
}
async function falha(pedidoId, itemId) {
  const motivo = prompt('Motivo da falha:', '');
  if (motivo === null) return;
  const gramas = prompt('Gramas de filamento perdidas nessa tentativa (opcional):', '0');
  await apiPatch(`/api/pedidos/${pedidoId}/itens/${itemId}/producao`, { action: 'falha', motivo, gramasReimpressao: gramas });
  toast('Falha registrada.', 'error');
  load();
}
window.atribuir = atribuir; window.iniciar = iniciar; window.concluirImpressao = concluirImpressao; window.falha = falha;

function itensDe(status) {
  const out = [];
  pedidosCache.forEach(p => p.itens.forEach(it => { if (it.status === status) out.push({ p, it }); }));
  return out;
}
function impressoraSelect(p, it) {
  const placeholder = `<option value="" ${!it.impressoraId ? 'selected' : ''}>— Selecionar —</option>`;
  const opts = impressorasCache.map(i => `<option value="${i.id}" ${it.impressoraId === i.id ? 'selected' : ''}>${escapeHtml(i.nome)}</option>`).join('');
  return `<select onclick="event.stopPropagation()" onchange="event.stopPropagation(); atribuir(${p.id}, ${it.id}, this)" style="width:150px">${placeholder}${opts}</select>`;
}
function renderFila() {
  const fila = itensDe('na_fila');
  document.getElementById('fila').innerHTML = fila.length ? `
    <table><thead><tr><th>#</th><th>Cliente</th><th>Produto</th><th>Peso/Tempo</th><th>Impressora</th><th>Ações</th></tr></thead>
    <tbody>${fila.map(({ p, it }) => `<tr>
      <td>#${p.id}</td><td>${escapeHtml(p.cliente)}</td><td>${it.imagem ? `<img class="thumb" src="${escapeAttr(it.imagem)}" /> ` : ''}${it.quantidade}x ${escapeHtml(it.descricao)}${it.variacao ? ` <span class="muted">(${escapeHtml(it.variacao)})</span>` : ''}</td>
      <td>${it.orcamento ? somaPesoOrcamento(it.orcamento) + 'g / ' + it.orcamento.tempoHoras + 'h' : '—'}</td>
      <td>${impressoraSelect(p, it)}</td>
      <td>
        <button class="small" onclick="event.stopPropagation(); iniciar(${p.id}, ${it.id})" ${!it.impressoraId ? 'disabled title="Atribua uma impressora primeiro"' : ''}>Iniciar impressão</button>
        <button class="small danger" onclick="event.stopPropagation(); falha(${p.id}, ${it.id})">Registrar falha</button>
      </td>
    </tr>`).join('')}</tbody></table>` : '<p class="muted">Fila vazia.</p>';

  const imprimindo = itensDe('imprimindo');
  document.getElementById('imprimindo').innerHTML = imprimindo.length ? `
    <table><thead><tr><th>#</th><th>Cliente</th><th>Produto</th><th>Impressora</th><th>Início</th><th>Ações</th></tr></thead>
    <tbody>${imprimindo.map(({ p, it }) => `<tr>
      <td>#${p.id}</td><td>${escapeHtml(p.cliente)}</td><td>${it.imagem ? `<img class="thumb" src="${escapeAttr(it.imagem)}" /> ` : ''}${it.quantidade}x ${escapeHtml(it.descricao)}${it.variacao ? ` <span class="muted">(${escapeHtml(it.variacao)})</span>` : ''}</td>
      <td>${it.impressoraId ? escapeHtml((impressorasCache.find(i=>i.id===it.impressoraId)||{}).nome) : '—'}</td>
      <td class="muted">${fmtDate(it.inicioImpressao)}</td>
      <td>
        <button class="small" onclick="event.stopPropagation(); concluirImpressao(${p.id}, ${it.id})">Concluir</button>
        <button class="small danger" onclick="event.stopPropagation(); falha(${p.id}, ${it.id})">Registrar falha</button>
      </td>
    </tr>`).join('')}</tbody></table>` : '<p class="muted">Nenhuma impressão em andamento.</p>';
}

function acoes(p) {
  let a = '';
  if (p.status === 'orcamento_pronto') {
    a += `<button class="small" onclick="event.stopPropagation(); aprovar(${p.id})">Cliente aprovou</button>`;
    a += `<button class="small danger" onclick="event.stopPropagation(); recusar(${p.id})">Cliente recusou</button>`;
  } else if (['novo'].includes(p.status)) {
    a += `<span class="muted">Aguardando orçamento</span>`;
  } else if (['na_fila', 'imprimindo'].includes(p.status)) {
    a += `<span class="muted">Em produção</span>`;
  } else if (p.status === 'concluido') {
    if (!p.statusEntrega || p.statusEntrega === 'aguardando') a += `<button class="small secondary" onclick="event.stopPropagation(); marcarEntrega(${p.id},'em_entrega')">Saiu para entrega</button>`;
    if (p.statusEntrega === 'em_entrega') a += `<button class="small secondary" onclick="event.stopPropagation(); marcarEntrega(${p.id},'entregue')">Marcar entregue</button>`;
  }
  if (p.itens.some(it => it.orcamento)) {
    a += `<button class="small secondary" onclick="event.stopPropagation(); window.open('orcamento-imprimir.html?id=${p.id}', '_blank')">Exportar PDF</button>`;
  }
  return a || '—';
}

function produtos(p) {
  return p.itens.map(it => `${it.imagem ? `<img class="thumb" src="${escapeAttr(it.imagem)}" /> ` : ''}${it.quantidade}x ${escapeHtml(it.descricao)}${it.variacao ? ` <span class="muted">(${escapeHtml(it.variacao)})</span>` : ''}`).join('<br>');
}

function valorPedido(p) {
  const orcados = p.itens.filter(it => it.orcamento);
  if (!orcados.length) return '—';
  const total = orcados.reduce((s, it) => s + it.orcamento.precoVenda * it.quantidade, 0) + totalDespesasPedido(p);
  return money(total) + (orcados.length < p.itens.length ? ` <span class="muted">(${orcados.length}/${p.itens.length})</span>` : '');
}

function renderPedidos() {
  const termo = document.getElementById('busca-pedido').value.trim().toLowerCase();
  const filtrados = !termo ? pedidosCache : pedidosCache.filter((p) =>
    String(p.id).includes(termo) ||
    (p.cliente || '').toLowerCase().includes(termo) ||
    (p.idPlataforma || '').toLowerCase().includes(termo)
  );
  document.getElementById('tbody').innerHTML = filtrados.map(p => `
    <tr class="clickable" onclick="abrirEditarPedido(${p.id})">
      <td>#${p.id}</td>
      <td>${escapeHtml(p.cliente)}<div class="muted">${escapeHtml(p.contato || '')}${p.idPlataforma ? `<br>${escapeHtml(p.idPlataforma)}` : ''}</div></td>
      <td>${produtos(p)}</td>
      <td>${badge(p.status)}${p.statusEntrega ? ' ' + badge(p.statusEntrega) : ''}</td>
      <td>${valorPedido(p)}</td>
      <td>${p.statusEntrega ? badge(p.statusEntrega) : '—'}</td>
      <td>${badge(p.statusPagamento)}</td>
      <td>${acoes(p)}</td>
    </tr>
  `).join('') || '<tr><td colspan="8" class="muted">Nenhum pedido encontrado.</td></tr>';
}
document.getElementById('busca-pedido').addEventListener('input', renderPedidos);

async function load() {
  await loadCatalogos();
  pedidosCache = await apiGet('/api/pedidos');
  renderPedidos();
  renderFila();
}
load();
</script>
</body>
</html>
