<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Entrar — Impressão 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <h1>🖨 Impressão 3D</h1>
    <p class="subtitle">Entre com seu e-mail e senha</p>
    <form id="form-login">
      <div class="field" style="margin-bottom:10px"><label>E-mail</label><input name="email" type="email" required autofocus /></div>
      <div class="field" style="margin-bottom:14px"><label>Senha</label><input name="senha" type="password" required /></div>
      <button type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
</div>
<script src="app.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  try {
    await apiPost('/api/auth/login', { email: form.email.value, senha: form.senha.value });
    window.location.href = 'index.html';
  } catch (err) {
    // apiPost já mostra o toast de erro
  }
});
</script>
</body>
</html>
