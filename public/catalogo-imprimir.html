<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Catálogo — Ateliê 3D Home</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { background: #ece7e2; }
  .print-toolbar {
    max-width: 920px;
    margin: 18px auto 0;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .print-sheet {
    max-width: 920px;
    margin: 16px auto 48px;
    background: #fff;
    padding: 48px 56px;
    box-shadow: 0 2px 18px rgba(0,0,0,.12);
    font-size: 14px;
    color: #2b2320;
    border-radius: 4px;
  }
  .doc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 2px solid #c9a27a;
    padding-bottom: 18px;
    margin-bottom: 26px;
  }
  .doc-header img { height: 92px; width: auto; }
  .doc-header .meta { text-align: right; }
  .doc-header .meta h1 { margin: 0; font-size: 22px; color: #6b4a36; letter-spacing: .02em; }
  .doc-header .meta .num { font-size: 13px; color: #8a7a6c; margin-top: 4px; }
  .catalogo-categoria-titulo {
    font-size: 16px;
    color: #6b4a36;
    border-bottom: 1px solid #e6d9cd;
    padding-bottom: 6px;
    margin: 28px 0 14px;
    break-after: avoid;
  }
  .catalogo-categoria-titulo:first-of-type { margin-top: 0; }
  .catalogo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-bottom: 10px;
  }
  .produto-card-print {
    border: 1px solid #e6d9cd;
    border-radius: 8px;
    padding: 14px;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .produto-card-print img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    border-radius: 6px;
    background: #f7f3ef;
    display: block;
  }
  .produto-card-print .sem-imagem {
    width: 100%;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c4b8ab;
    background: #f7f3ef;
    border-radius: 6px;
    font-size: 12px;
  }
  .produto-card-print h3 { margin: 10px 0 3px; font-size: 15px; color: #6b4a36; }
  .produto-card-print .desc { font-size: 12px; color: #8a7a6c; margin-bottom: 8px; }
  .produto-card-print .dims { font-size: 11px; color: #a89a8d; margin-bottom: 6px; }
  .produto-card-print .precos { font-size: 13px; }
  .produto-card-print .precos .linha {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-top: 1px dashed #f0e6dc;
  }
  .produto-card-print .precos .linha:first-child { border-top: none; }
  .produto-card-print .precos .linha b { color: #6b4a36; }
  .produto-card-print .precos .linha .indisponivel { color: #a89a8d; font-style: italic; }
  .doc-footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid #e6d9cd;
    font-size: 12px;
    color: #8a7a6c;
    text-align: center;
  }
  .doc-footer a { color: #8a7a6c; }
  .doc-footer .aviso { margin-top: 6px; font-size: 11px; }
  .doc-erro { padding: 40px; text-align: center; color: var(--muted); }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .print-sheet { box-shadow: none !important; margin: 0 !important; border-radius: 0; max-width: none; padding: 0; }
    @page { margin: 14mm; }
  }
</style>
</head>
<body>

<div class="print-toolbar no-print">
  <button type="button" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button>
  <button type="button" class="secondary" onclick="window.close()">Fechar</button>
</div>

<div class="print-sheet" id="sheet"><p class="muted">Carregando catálogo...</p></div>

<script src="app.js"></script>
<script>
const CUSTO_FILAMENTO_PADRAO = 120; // R$/kg usado quando a variação não tem filamento sugerido
const POTENCIA_PADRAO = 200; // W usado quando a variação não tem impressora sugerida
const MARGEM_PADRAO_CATALOGO = 4; // custo + 300%

function custoVariacao(v, filamentos, impressoras, tarifaKwh) {
  if (!v.pesoGramas || !v.tempoHoras) return null;
  const filamento = v.filamentoIdSugerido ? filamentos.find((f) => f.id === v.filamentoIdSugerido) : null;
  const impressora = v.impressoraIdSugerida ? impressoras.find((i) => i.id === v.impressoraIdSugerida) : null;
  const precoPorKg = filamento ? filamento.precoPorKg : CUSTO_FILAMENTO_PADRAO;
  const potenciaW = impressora ? impressora.potenciaW : POTENCIA_PADRAO;
  const custoFilamento = (precoPorKg / 1000) * v.pesoGramas;
  const custoEnergia = ((potenciaW * v.tempoHoras) / 1000) * tarifaKwh;
  return custoFilamento + custoEnergia;
}

function parseMoedaBR(str) {
  if (!str) return null;
  const n = parseFloat(String(str).replace(/\./g, '').replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

// Produtos importados de planilhas antigas guardam peso/tempo/custo/venda como texto
// livre no campo "descrição" (ex: "Peso: 107g · Tempo: 4,5h · Custo: R$ 13,30").
// Isso nunca pode aparecer no catálogo do cliente: extraímos só o valor de venda (ou
// custo, para aplicar a margem) e escondemos essa descrição-metadado da exibição.
function extrairDoDescricao(descricao) {
  const texto = descricao || '';
  const venda = /Venda:\s*R\$\s*([\d.,]+)/i.exec(texto);
  const custo = /Custo:\s*R\$\s*([\d.,]+)/i.exec(texto);
  return {
    venda: venda ? parseMoedaBR(venda[1]) : null,
    custo: custo ? parseMoedaBR(custo[1]) : null,
    ehMetadados: /Peso:|Tempo:|Custo:|Venda:/i.test(texto)
  };
}

function precoHistorico(pedidos, produtoId, variacaoNome) {
  const alvo = (variacaoNome || '').trim().toLowerCase();
  let melhor = null;
  for (const p of pedidos) {
    for (const it of p.itens) {
      if (it.produtoId !== produtoId || !it.orcamento) continue;
      const itVar = (it.variacao || '').trim().toLowerCase();
      if (itVar !== alvo) continue;
      const quando = it.orcamento.criadoEm || p.createdAt || '';
      if (!melhor || quando > melhor.quando) melhor = { preco: it.orcamento.precoVenda, quando };
    }
  }
  return melhor ? melhor.preco : null;
}

function precoLinha(nome, preco) {
  const rotulo = nome ? escapeHtml(nome) : 'Valor';
  if (preco == null) return `<div class="linha"><span>${rotulo}</span><span class="indisponivel">Sob consulta</span></div>`;
  return `<div class="linha"><span>${rotulo}</span><span><b>${money(preco)}</b></span></div>`;
}

async function load() {
  const sheet = document.getElementById('sheet');
  let produtos, categorias, variacoesTodas, filamentos, impressoras, params, pedidos;
  try {
    [produtos, categorias, variacoesTodas, filamentos, impressoras, params, pedidos] = await Promise.all([
      apiGet('/api/produtos'), apiGet('/api/categorias-produto'), apiGet('/api/variacoes'), apiGet('/api/filamentos'),
      apiGet('/api/impressoras'), apiGet('/api/params'), apiGet('/api/pedidos')
    ]);
  } catch (e) {
    sheet.innerHTML = '<p class="doc-erro">Não foi possível carregar o catálogo.</p>';
    return;
  }

  const produtosAtivos = produtos.filter((p) => p.ativo !== false);
  if (!produtosAtivos.length) {
    sheet.innerHTML = '<p class="doc-erro">Nenhum produto cadastrado ainda.</p>';
    return;
  }

  const tarifaKwh = params.tarifaKwh || 0;
  const hoje = new Date().toLocaleDateString('pt-BR');

  function cardHtml(produto) {
    const variacoesDoProduto = variacoesTodas.filter((v) => v.produtoId === produto.id);
    const { venda: vendaDescricao, custo: custoDescricao, ehMetadados } = extrairDoDescricao(produto.descricao);
    const descricaoExibivel = ehMetadados ? '' : produto.descricao;

    let linhasPreco;
    if (variacoesDoProduto.length) {
      linhasPreco = variacoesDoProduto.map((v) => {
        if (v.precoVenda != null) return precoLinha(v.nome, v.precoVenda);
        const hist = precoHistorico(pedidos, produto.id, v.nome);
        if (hist != null) return precoLinha(v.nome, hist);
        const custo = custoVariacao(v, filamentos, impressoras, tarifaKwh);
        return precoLinha(v.nome, custo != null ? custo * MARGEM_PADRAO_CATALOGO : null);
      }).join('');
    } else {
      let preco = precoHistorico(pedidos, produto.id, '');
      if (preco == null) preco = vendaDescricao;
      if (preco == null && custoDescricao != null) preco = custoDescricao * MARGEM_PADRAO_CATALOGO;
      linhasPreco = precoLinha(null, preco);
    }

    return `
      <div class="produto-card-print">
        ${produto.imagem ? `<img src="${escapeAttr(produto.imagem)}" alt="${escapeHtml(produto.nome)}" />` : '<div class="sem-imagem">sem imagem</div>'}
        <h3>${escapeHtml(produto.nome)}</h3>
        ${produto.dimensoes ? `<div class="dims">${escapeHtml(produto.dimensoes)}</div>` : ''}
        ${descricaoExibivel ? `<div class="desc">${escapeHtml(descricaoExibivel)}</div>` : ''}
        <div class="precos">${linhasPreco}</div>
      </div>
    `;
  }

  // Agrupa por categoria (ordem alfabética, "Sem categoria" sempre por último) e ordena os
  // produtos dentro de cada grupo por nome — deixa o catálogo impresso organizado por seção.
  const nomeCategoria = (categoriaId) => {
    const c = categoriaId ? categorias.find((x) => x.id === categoriaId) : null;
    return c ? c.nome : null;
  };
  const grupos = new Map();
  produtosAtivos.forEach((p) => {
    const nome = nomeCategoria(p.categoriaId);
    const chave = nome || '￿ Sem categoria'; // ￿ garante que "Sem categoria" ordene por último
    if (!grupos.has(chave)) grupos.set(chave, { titulo: nome || 'Sem categoria', produtos: [] });
    grupos.get(chave).produtos.push(p);
  });
  const secoes = [...grupos.entries()]
    .sort(([a], [b]) => a.localeCompare(b, 'pt-BR'))
    .map(([, grupo]) => {
      const cards = grupo.produtos.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(cardHtml).join('');
      return `
        ${grupos.size > 1 ? `<h2 class="catalogo-categoria-titulo">${escapeHtml(grupo.titulo)}</h2>` : ''}
        <div class="catalogo-grid">${cards}</div>
      `;
    }).join('');

  sheet.innerHTML = `
    <div class="doc-header">
      <img src="assets/logo-atelie.jpeg" alt="Ateliê 3D Home" />
      <div class="meta">
        <h1>Catálogo de Produtos</h1>
        <div class="num">${produtosAtivos.length} produto(s) &middot; ${hoje}</div>
      </div>
    </div>

    ${secoes}

    <div class="doc-footer">
      Ateliê 3D Home &nbsp;·&nbsp;
      Instagram: <a href="https://www.instagram.com/atelie3d.home/" target="_blank" rel="noopener">@atelie3d.home</a> &nbsp;·&nbsp;
      E-mail: lsgrando@gmail.com
      <div class="aviso">Valores estimados, sujeitos a confirmação conforme cor, tamanho e disponibilidade de material. Consulte prazo de produção.</div>
    </div>
  `;
}
load();
</script>
</body>
</html>
