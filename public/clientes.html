<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Clientes — Impressão 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Clientes</h1>
  <p class="subtitle">Cadastre os clientes para reaproveitar os dados na tela de Vendas.</p>

  <div class="toolbar">
    <div class="field search"><input id="busca" placeholder="Buscar por nome, contato ou e-mail..." /></div>
    <button type="button" onclick="abrirNovoCliente()">+ Novo cliente</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Nome</th><th>Contato</th><th>E-mail</th><th>Endereço</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div id="modal-bg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
  <div class="modal-wrap" style="width:460px;max-width:92vw;">
    <button type="button" class="modal-close" onclick="closeModal()" aria-label="Fechar">&times;</button>
    <div class="card" id="modal-content"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
renderNav('clientes.html');
let clientesCache = [];

function formCliente(titulo, valores, onSubmit) {
  document.getElementById('modal-content').innerHTML = `
    <h2 style="margin-top:0">${titulo}</h2>
    <form class="inline" id="form-cliente-modal">
      <div class="field" style="min-width:100%"><label>Nome</label><input name="nome" value="${escapeAttr(valores.nome || '')}" required /></div>
      <div class="field"><label>Contato (WhatsApp)</label><input name="contato" value="${escapeAttr(valores.contato || '')}" /></div>
      <div class="field"><label>E-mail</label><input name="email" type="email" value="${escapeAttr(valores.email || '')}" /></div>
      <div class="field" style="min-width:100%"><label>Endereço</label><input name="endereco" value="${escapeAttr(valores.endereco || '')}" placeholder="Rua, número, bairro, cidade" /></div>
      <div class="field" style="min-width:100%"><label>Observações</label><textarea name="observacoes" placeholder="Preferências, histórico, detalhes extras">${escapeHtml(valores.observacoes || '')}</textarea></div>
      <div class="row" style="width:100%">
        <button type="submit">Salvar</button>
        <button type="button" class="secondary" onclick="closeModal()">Cancelar</button>
      </div>
    </form>
  `;
  document.getElementById('modal-bg').style.display = 'flex';
  document.getElementById('form-cliente-modal').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await onSubmit(Object.fromEntries(fd.entries()));
    closeModal();
    load();
  });
}

function abrirNovoCliente() {
  formCliente('Novo cliente', {}, async (body) => {
    await apiPost('/api/clientes', body);
    toast('Cliente cadastrado com sucesso!');
  });
}
window.abrirNovoCliente = abrirNovoCliente;

function abrirEdicaoCliente(id) {
  const c = clientesCache.find((x) => x.id === id);
  if (!c) return;
  formCliente(`Editar cliente #${c.id}`, c, async (body) => {
    await apiPatch(`/api/clientes/${id}`, body);
    toast('Cliente atualizado com sucesso!');
  });
}
window.abrirEdicaoCliente = abrirEdicaoCliente;

function render() {
  const termo = document.getElementById('busca').value.trim().toLowerCase();
  const lista = !termo ? clientesCache : clientesCache.filter((c) =>
    c.nome.toLowerCase().includes(termo) || (c.contato || '').toLowerCase().includes(termo) || (c.email || '').toLowerCase().includes(termo)
  );
  document.getElementById('tbody').innerHTML = lista.length ? lista.map(c => `
    <tr class="clickable" onclick="abrirEdicaoCliente(${c.id})">
      <td>${escapeHtml(c.nome)}</td>
      <td>${escapeHtml(c.contato || '—')}</td>
      <td>${escapeHtml(c.email || '—')}</td>
      <td>${escapeHtml(c.endereco || '—')}</td>
    </tr>
  `).join('') : '<tr><td colspan="4" class="muted">Nenhum cliente cadastrado ainda.</td></tr>';
}
document.getElementById('busca').addEventListener('input', render);

async function load() {
  clientesCache = await apiGet('/api/clientes');
  render();
}
load();
</script>
</body>
</html>
